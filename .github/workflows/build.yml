          cat > app/src/main/java/com/example/vozgrave/PitchShifter.kt <<'REA_EOF_X'
          package com.example.vozgrave

          import kotlin.math.abs

          /**
           * Troca de tom em tempo real (delay line com dois "taps" e crossfade triangular).
           * ratio < 1 = voz mais grave.
           */
          class PitchShifter(sampleRate: Int, windowMs: Int = 50) {
              private val w = sampleRate * windowMs / 1000
              private val buf = FloatArray(w * 4)
              private var wp = 0
              private var phase = 0f
              var ratio = 1f

              fun process(x: Float): Float {
                  buf[wp] = x
                  phase += (1f - ratio) / w
                  if (phase >= 1f) phase -= 1f
                  if (phase < 0f) phase += 1f
                  val p2 = (phase + 0.5f) % 1f
                  val y = tap(phase) * gain(phase) + tap(p2) * gain(p2)
                  wp = (wp + 1) % buf.size
                  return y
              }

              private fun tap(p: Float): Float {
                  var pos = wp - (p * w + 1f)
                  if (pos < 0f) pos += buf.size
                  val i = pos.toInt()
                  val f = pos - i
                  val a = buf[i % buf.size]
                  val b = buf[(i + 1) % buf.size]
                  return a + (b - a) * f
              }

              private fun gain(p: Float) = 1f - abs(2f * p - 1f)
          }
