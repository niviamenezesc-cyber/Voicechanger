          package com.example.retoque

          import android.graphics.Bitmap
          import android.graphics.PointF
          import com.google.mlkit.vision.common.InputImage
          import com.google.mlkit.vision.face.Face
          import com.google.mlkit.vision.face.FaceContour
          import com.google.mlkit.vision.face.FaceDetection
          import com.google.mlkit.vision.face.FaceDetectorOptions
          import com.google.mlkit.vision.face.FaceLandmark
          import com.google.mlkit.vision.pose.Pose
          import com.google.mlkit.vision.pose.PoseDetection
          import com.google.mlkit.vision.pose.PoseLandmark
          import com.google.mlkit.vision.pose.defaults.PoseDetectorOptions

          /** Detecta rosto (contornos) e corpo (articulações) no aparelho, sem internet. */
          object Detector {

              fun detect(bmp: Bitmap, onDone: (Landmarks) -> Unit) {
                  val image = InputImage.fromBitmap(bmp, 0)
                  val options = FaceDetectorOptions.Builder()
                      .setPerformanceMode(FaceDetectorOptions.PERFORMANCE_MODE_ACCURATE)
                      .setLandmarkMode(FaceDetectorOptions.LANDMARK_MODE_ALL)
                      .setContourMode(FaceDetectorOptions.CONTOUR_MODE_ALL)
                      .build()
                  FaceDetection.getClient(options).process(image)
                      .addOnSuccessListener { faces -> detectPose(image, faces.map { toFace(it) }, onDone) }
                      .addOnFailureListener { detectPose(image, emptyList(), onDone) }
              }

              private fun detectPose(image: InputImage, faces: List<FaceData>, onDone: (Landmarks) -> Unit) {
                  val options = PoseDetectorOptions.Builder()
                      .setDetectorMode(PoseDetectorOptions.SINGLE_IMAGE_MODE)
                      .build()
                  PoseDetection.getClient(options).process(image)
                      .addOnSuccessListener { pose -> onDone(Landmarks(faces, toBody(pose))) }
                      .addOnFailureListener { onDone(Landmarks(faces, null)) }
              }

              private fun toFace(face: Face): FaceData {
                  fun pts(type: Int): List<PointF> = face.getContour(type)?.points ?: emptyList()
                  fun lm(type: Int): PointF? = face.getLandmark(type)?.position
                  return FaceData(
                      bounds = face.boundingBox,
                      outline = pts(FaceContour.FACE),
                      leftEye = pts(FaceContour.LEFT_EYE),
                      rightEye = pts(FaceContour.RIGHT_EYE),
                      brows = listOf(
                          pts(FaceContour.LEFT_EYEBROW_TOP),
                          pts(FaceContour.LEFT_EYEBROW_BOTTOM),
                          pts(FaceContour.RIGHT_EYEBROW_TOP),
                          pts(FaceContour.RIGHT_EYEBROW_BOTTOM)
                      ),
                      upperLipTop = pts(FaceContour.UPPER_LIP_TOP),
                      upperLipBottom = pts(FaceContour.UPPER_LIP_BOTTOM),
                      lowerLipTop = pts(FaceContour.LOWER_LIP_TOP),
                      lowerLipBottom = pts(FaceContour.LOWER_LIP_BOTTOM),
                      noseBottom = pts(FaceContour.NOSE_BOTTOM),
                      mouthLeft = lm(FaceLandmark.MOUTH_LEFT),
                      mouthRight = lm(FaceLandmark.MOUTH_RIGHT),
                      leftCheek = lm(FaceLandmark.LEFT_CHEEK),
                      rightCheek = lm(FaceLandmark.RIGHT_CHEEK)
                  )
              }

              private fun toBody(pose: Pose): BodyData? {
                  fun lm(type: Int): PointF? =
                      pose.getPoseLandmark(type)?.takeIf { it.inFrameLikelihood > 0.5f }?.position
                  val ls = lm(PoseLandmark.LEFT_SHOULDER)
                  val rs = lm(PoseLandmark.RIGHT_SHOULDER)
                  val lh = lm(PoseLandmark.LEFT_HIP)
                  val rh = lm(PoseLandmark.RIGHT_HIP)
                  if (ls == null || rs == null || lh == null || rh == null) return null
                  return BodyData(
                      leftShoulder = ls,
                      rightShoulder = rs,
                      leftHip = lh,
                      rightHip = rh,
                      leftKnee = lm(PoseLandmark.LEFT_KNEE),
                      rightKnee = lm(PoseLandmark.RIGHT_KNEE),
                      leftAnkle = lm(PoseLandmark.LEFT_ANKLE),
                      rightAnkle = lm(PoseLandmark.RIGHT_ANKLE)
                  )
              }
          }
          REA_EOF_X
          mkdir -p app/src/main/java/com/example/retoque
          cat > app/src/main/java/com/example/retoque/ImageOps.kt <<'REA_EOF_X'
          package com.example.retoque

          import android.graphics.Bitmap
          import android.graphics.BlurMaskFilter
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.ColorMatrix
          import android.graphics.Paint
          import android.graphics.Path
          import android.graphics.PointF
          import android.graphics.RadialGradient
          import android.graphics.Shader
          import kotlin.math.abs
          import kotlin.math.exp
          import kotlin.math.hypot
          import kotlin.math.max
          import kotlin.math.min

          object ImageOps {

              private fun c8(v: Float): Int = if (v < 0f) 0 else if (v > 255f) 255 else (v + 0.5f).toInt()

              /** Desfoque de caixa separável (rápido), canal a canal. */
              fun boxBlur(src: IntArray, w: Int, h: Int, r: Int): IntArray {
                  if (r < 1) return src.copyOf()
                  val tmp = IntArray(w * h)
                  val out = IntArray(w * h)
                  val div = 2 * r + 1
                  for (y in 0 until h) {
                      val row = y * w
                      var sr = 0
                      var sg = 0
                      var sb = 0
                      for (i in -r..r) {
                          val p = src[row + i.coerceIn(0, w - 1)]
                          sr += (p shr 16) and 255
                          sg += (p shr 8) and 255
                          sb += p and 255
                      }
                      for (x in 0 until w) {
                          tmp[row + x] = (0xFF shl 24) or ((sr / div) shl 16) or ((sg / div) shl 8) or (sb / div)
                          val add = src[row + (x + r + 1).coerceAtMost(w - 1)]
                          val rem = src[row + (x - r).coerceAtLeast(0)]
                          sr += ((add shr 16) and 255) - ((rem shr 16) and 255)
                          sg += ((add shr 8) and 255) - ((rem shr 8) and 255)
                          sb += (add and 255) - (rem and 255)
                      }
                  }
                  for (x in 0 until w) {
                      var sr = 0
                      var sg = 0
                      var sb = 0
                      for (i in -r..r) {
                          val p = tmp[i.coerceIn(0, h - 1) * w + x]
                          sr += (p shr 16) and 255
                          sg += (p shr 8) and 255
                          sb += p and 255
                      }
                      for (y in 0 until h) {
                          out[y * w + x] = (0xFF shl 24) or ((sr / div) shl 16) or ((sg / div) shl 8) or (sb / div)
                          val add = tmp[(y + r + 1).coerceAtMost(h - 1) * w + x]
                          val rem = tmp[(y - r).coerceAtLeast(0) * w + x]
                          sr += ((add shr 16) and 255) - ((rem shr 16) and 255)
                          sg += ((add shr 8) and 255) - ((rem shr 8) and 255)
                          sb += (add and 255) - (rem and 255)
                      }
                  }
                  return out
              }

              private fun pathOf(pts: List<PointF>): Path {
                  val path = Path()
                  if (pts.isEmpty()) return path
                  path.moveTo(pts[0].x, pts[0].y)
                  for (i in 1 until pts.size) path.lineTo(pts[i].x, pts[i].y)
                  path.close()
                  return path
              }

              private fun join(a: List<PointF>, b: List<PointF>): List<PointF> {
                  if (a.isEmpty() || b.isEmpty()) return a + b
                  val last = a.last()
                  val dFirst = hypot(last.x - b.first().x, last.y - b.first().y)
                  val dLast = hypot(last.x - b.last().x, last.y - b.last().y)
                  return a + (if (dFirst > dLast) b.reversed() else b)
              }

              private fun lipOuter(f: FaceData) = join(f.upperLipTop, f.lowerLipBottom)
              private fun lipInner(f: FaceData) = join(f.upperLipBottom, f.lowerLipTop)

              /** Máscara de pele (0..1): rosto sem olhos, sobrancelhas e lábios, com borda suave. */
              fun faceMask(w: Int, h: Int, faces: List<FaceData>): FloatArray {
                  val bmp = Bitmap.createBitmap(w, h, Bitmap.Config.ARGB_8888)
                  val c = Canvas(bmp)
                  c.drawColor(Color.BLACK)
                  var minFace = w
                  for (f in faces) minFace = min(minFace, f.bounds.width())
                  val white = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                      color = Color.WHITE
                      style = Paint.Style.FILL
                  }
                  val black = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                      color = Color.BLACK
                      style = Paint.Style.FILL_AND_STROKE
                      strokeWidth = max(2f, minFace * 0.03f)
                  }
                  for (f in faces) {
                      c.drawPath(pathOf(f.outline), white)
                      c.drawPath(pathOf(f.leftEye), black)
                      c.drawPath(pathOf(f.rightEye), black)
                      for (b in f.brows) c.drawPath(pathOf(b), black)
                      c.drawPath(pathOf(lipOuter(f)), black)
                  }
                  val px = IntArray(w * h)
                  bmp.getPixels(px, 0, w, 0, 0, w, h)
                  bmp.recycle()
                  val r = max(2, minFace / 25)
                  val blurred = boxBlur(boxBlur(px, w, h, r), w, h, r)
                  return FloatArray(w * h) { ((blurred[it] shr 16) and 255) / 255f }
              }

              /** Suaviza a pele preservando bordas (olhos, cabelo, contornos). */
              fun smoothSkin(px: IntArray, w: Int, h: Int, mask: FloatArray?, amount: Float) {
                  val r = max(2, min(w, h) / 160)
                  val blur = boxBlur(boxBlur(px, w, h, r), w, h, r)
                  val inv2s2 = 1f / (2f * 20f * 20f)
                  for (i in px.indices) {
                      val m = if (mask != null) mask[i] else 1f
                      if (m < 0.02f) continue
                      val p = px[i]
                      val b = blur[i]
                      val pr = (p shr 16) and 255
                      val pg = (p shr 8) and 255
                      val pb = p and 255
                      val br = (b shr 16) and 255
                      val bg = (b shr 8) and 255
                      val bb = b and 255
                      val d = (abs(pr - br) + abs(pg - bg) + abs(pb - bb)) / 3f
                      val edge = exp(-(d * d) * inv2s2)
                      val t = amount * 0.9f * m * edge
                      val nr = c8(pr + (br - pr) * t)
                      val ng = c8(pg + (bg - pg) * t)
                      val nb = c8(pb + (bb - pb) * t)
                      px[i] = (0xFF shl 24) or (nr shl 16) or (ng shl 8) or nb
                  }
              }

              /** Clareia a pele. */
              fun whiten(px: IntArray, mask: FloatArray?, amount: Float) {
                  for (i in px.indices) {
                      val m = if (mask != null) mask[i] else 1f
                      if (m < 0.02f) continue
                      val k = 0.28f * amount * m
                      val p = px[i]
                      val r = (p shr 16) and 255
                      val g = (p shr 8) and 255
                      val b = p and 255
                      px[i] = (0xFF shl 24) or
                          (c8(r + (255 - r) * k) shl 16) or
                          (c8(g + (255 - g) * k) shl 8) or
                          c8(b + (255 - b) * k)
                  }
              }

              fun sharpen(px: IntArray, w: Int, h: Int, amount: Float) {
                  val blur = boxBlur(px, w, h, 2)
                  for (i in px.indices) {
                      val p = px[i]
                      val b = blur[i]
                      val pr = (p shr 16) and 255
                      val pg = (p shr 8) and 255
                      val pb = p and 255
                      val nr = c8(pr + amount * (pr - ((b shr 16) and 255)))
                      val ng = c8(pg + amount * (pg - ((b shr 8) and 255)))
                      val nb = c8(pb + amount * (pb - (b and 255)))
                      px[i] = (0xFF shl 24) or (nr shl 16) or (ng shl 8) or nb
                  }
              }

              /** Batom e blush desenhados sobre o bitmap. */
              fun makeup(bmp: Bitmap, faces: List<FaceData>, lipstick: Int, blush: Int) {
                  val c = Canvas(bmp)
                  for (f in faces) {
                      val fw = f.bounds.width().toFloat()
                      if (lipstick > 0) {
                          val outer = lipOuter(f)
                          val inner = lipInner(f)
                          if (outer.size >= 3) {
                              val path = Path()
                              path.fillType = Path.FillType.EVEN_ODD
                              path.addPath(pathOf(outer))
                              if (inner.size >= 3) path.addPath(pathOf(inner))
                              val paint = Paint(Paint.ANTI_ALIAS_FLAG)
                              paint.style = Paint.Style.FILL
                              paint.color = Color.argb((lipstick * 1.6f).toInt().coerceIn(0, 160), 200, 30, 70)
                              paint.maskFilter = BlurMaskFilter(max(1f, fw * 0.01f), BlurMaskFilter.Blur.NORMAL)
                              c.drawPath(path, paint)
                          }
                      }
                      if (blush > 0) {
                          val alpha = (blush * 1.2f).toInt().coerceIn(0, 120)
                          for (p in listOfNotNull(f.leftCheek, f.rightCheek)) {
                              val r = fw * 0.2f
                              val paint = Paint(Paint.ANTI_ALIAS_FLAG)
                              paint.shader = RadialGradient(
                                  p.x, p.y, r,
                                  Color.argb(alpha, 255, 90, 110),
                                  Color.argb(0, 255, 90, 110),
                                  Shader.TileMode.CLAMP
                              )
                              c.drawCircle(p.x, p.y, r, paint)
                          }
                      }
                  }
              }

              private val IDENTITY = floatArrayOf(
                  1f, 0f, 0f, 0f, 0f,
                  0f, 1f, 0f, 0f, 0f,
                  0f, 0f, 1f, 0f, 0f,
                  0f, 0f, 0f, 1f, 0f
              )

              private fun scaleArr(r: Float, g: Float, b: Float, off: Float = 0f) = floatArrayOf(
                  r, 0f, 0f, 0f, off,
                  0f, g, 0f, 0f, off,
                  0f, 0f, b, 0f, off,
                  0f, 0f, 0f, 1f, 0f
              )

              private fun contrastArr(c: Float): FloatArray = scaleArr(c, c, c, (1f - c) * 127.5f)

              private fun satMatrix(s: Float): ColorMatrix {
                  val m = ColorMatrix()
                  m.setSaturation(s)
                  return m
              }

              private fun filterArray(idx: Int): FloatArray {
                  return when (idx) {
                      1 -> {
                          val m = satMatrix(1.45f)
                          m.postConcat(ColorMatrix(contrastArr(1.1f)))
                          m.array
                      }
                      2 -> {
                          val m = satMatrix(0f)
                          m.postConcat(ColorMatrix(contrastArr(1.15f)))
                          m.array
                      }
                      3 -> floatArrayOf(
                          0.393f, 0.769f, 0.189f, 0f, 0f,
                          0.349f, 0.686f, 0.168f, 0f, 0f,
                          0.272f, 0.534f, 0.131f, 0f, 0f,
                          0f, 0f, 0f, 1f, 0f
                      )
                      4 -> scaleArr(0.90f, 1.0f, 1.15f)
                      5 -> scaleArr(1.15f, 1.0f, 0.88f)
                      6 -> {
                          val m = ColorMatrix(scaleArr(0.86f, 0.86f, 0.86f, 22f))
                          m.postConcat(satMatrix(0.9f))
                          m.array
                      }
                      7 -> {
                          val m = satMatrix(0.75f)
                          m.postConcat(ColorMatrix(scaleArr(1.08f, 1.0f, 0.85f, 8f)))
                          m.array
                      }
                      else -> IDENTITY
                  }
              }

              fun colorMatrix(
                  brightness: Int, contrast: Int, saturation: Int, warmth: Int,
                  filter: Int, fstrength: Int
              ): ColorMatrix {
                  val cm = ColorMatrix()
                  cm.postConcat(satMatrix(max(0f, 1f + saturation / 100f)))
                  val c = 1f + contrast / 100f
                  val t = (1f - c) * 127.5f + brightness * 1.5f
                  cm.postConcat(ColorMatrix(scaleArr(c, c, c, t)))
                  val wv = warmth / 100f
                  cm.postConcat(ColorMatrix(scaleArr(1f + 0.3f * wv, 1f, 1f - 0.3f * wv)))
                  if (filter != 0 && fstrength > 0) {
                      val s = fstrength / 100f
                      val f = filterArray(filter)
                      cm.postConcat(ColorMatrix(FloatArray(20) { IDENTITY[it] + (f[it] - IDENTITY[it]) * s }))
                  }
                  return cm
              }
          }
          REA_EOF_X
          mkdir -p app/src/main/java/com/example/retoque
          cat > app/src/main/java/com/example/retoque/MainActivity.kt <<'REA_EOF_X'
          package com.example.retoque

          import android.content.ContentValues
          import android.graphics.Bitmap
          import android.graphics.BitmapFactory
          import android.graphics.Color
          import android.graphics.Matrix
          import android.media.ExifInterface
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.MediaStore
          import android.view.MotionEvent
          import android.view.View
          import android.widget.Button
          import android.widget.FrameLayout
          import android.widget.HorizontalScrollView
          import android.widget.ImageView
          import android.widget.LinearLayout
          import android.widget.SeekBar
          import android.widget.TextView
          import android.widget.Toast
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.appcompat.app.AppCompatActivity
          import java.util.concurrent.Executors
          import kotlin.math.max

          class Tool(val id: String, val label: String, val min: Int, val max: Int)

          class MainActivity : AppCompatActivity() {

              private lateinit var img: ImageView
              private lateinit var hint: TextView
              private lateinit var info: TextView
              private lateinit var tabRow: LinearLayout
              private lateinit var toolBox: LinearLayout

              private var base: Bitmap? = null
              private var shown: Bitmap? = null
              private var landmarks: Landmarks? = null
              private val params = HashMap<String, Int>()
              private val executor = Executors.newSingleThreadExecutor()
              @Volatile private var gen = 0
              private var currentTab = "Rosto"
              private var warnedBody = false
              private var warnedFace = false

              private val tabs: LinkedHashMap<String, List<Tool>> = linkedMapOf(
                  "Rosto" to listOf(
                      Tool("smooth", "Suavizar pele", 0, 100),
                      Tool("whiten", "Clarear pele", 0, 100),
                      Tool("faceSlim", "Afinar rosto", 0, 100),
                      Tool("chin", "Queixo menor", 0, 100),
                      Tool("eyes", "Olhos maiores", 0, 100),
                      Tool("nose", "Nariz mais fino", 0, 100),
                      Tool("smile", "Sorriso", 0, 100)
                  ),
                  "Maquiagem" to listOf(
                      Tool("lipstick", "Batom", 0, 100),
                      Tool("blush", "Blush", 0, 100)
                  ),
                  "Corpo" to listOf(
                      Tool("bodySlim", "Corpo mais fino", 0, 100),
                      Tool("waist", "Cintura", 0, 100),
                      Tool("legLong", "Pernas mais longas", 0, 100),
                      Tool("legSlim", "Pernas mais finas", 0, 100),
                      Tool("headSmall", "Cabeça menor", 0, 100)
                  ),
                  "Cor" to listOf(
                      Tool("brightness", "Brilho", -50, 50),
                      Tool("contrast", "Contraste", -50, 50),
                      Tool("saturation", "Saturação", -50, 50),
                      Tool("warmth", "Frio / quente", -50, 50),
                      Tool("sharp", "Nitidez", 0, 100)
                  ),
                  "Filtros" to emptyList<Tool>()
              )

              private val filterNames = listOf("Original", "Vívido", "P&B", "Sépia", "Frio", "Quente", "Suave", "Retrô")
              private val bodyIds = setOf("bodySlim", "waist", "legLong", "legSlim")
              private val faceIds = setOf("faceSlim", "chin", "eyes", "nose", "smile", "headSmall", "lipstick", "blush")

              private val pickImage =
                  registerForActivityResult(ActivityResultContracts.GetContent()) { uri ->
                      if (uri != null) loadImage(uri)
                  }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)

                  img = findViewById(R.id.img)
                  hint = findViewById(R.id.hint)
                  info = findViewById(R.id.info)
                  tabRow = findViewById(R.id.tabRow)
                  toolBox = findViewById(R.id.toolBox)

                  initParams()
                  for (name in tabs.keys) {
                      val b = Button(this)
                      b.text = name
                      b.setOnClickListener { showTab(name) }
                      tabRow.addView(b)
                  }
                  showTab(currentTab)

                  findViewById<Button>(R.id.btnOpen).setOnClickListener { pickImage.launch("image/*") }
                  findViewById<Button>(R.id.btnSave).setOnClickListener { save() }
                  findViewById<Button>(R.id.btnReset).setOnClickListener { resetAll() }
                  findViewById<Button>(R.id.btnCompare).setOnTouchListener { _, ev ->
                      if (ev.action == MotionEvent.ACTION_DOWN) {
                          base?.let { img.setImageBitmap(it) }
                      } else if (ev.action == MotionEvent.ACTION_UP || ev.action == MotionEvent.ACTION_CANCEL) {
                          (shown ?: base)?.let { img.setImageBitmap(it) }
                      }
                      true
                  }
              }

              private fun dp(x: Int): Int = (x * resources.displayMetrics.density).toInt()

              private fun initParams() {
                  params.clear()
                  params["fstrength"] = 100
              }

              private fun resetAll() {
                  initParams()
                  shown = null
                  base?.let { img.setImageBitmap(it) }
                  showTab(currentTab)
              }

              private fun showTab(name: String) {
                  currentTab = name
                  for (i in 0 until tabRow.childCount) {
                      val b = tabRow.getChildAt(i) as Button
                      b.alpha = if (b.text.toString() == name) 1f else 0.45f
                  }
                  toolBox.removeAllViews()
                  if (name == "Filtros") {
                      val sv = HorizontalScrollView(this)
                      val row = LinearLayout(this)
                      row.orientation = LinearLayout.HORIZONTAL
                      filterNames.forEachIndexed { i, n ->
                          val b = Button(this)
                          b.text = n
                          b.setOnClickListener {
                              params["filter"] = i
                              onParamChanged("filter")
                          }
                          row.addView(b)
                      }
                      sv.addView(row)
                      toolBox.addView(sv)
                      addSlider(Tool("fstrength", "Intensidade do filtro", 0, 100))
                  } else {
                      tabs[name]?.forEach { addSlider(it) }
                  }
              }

              private fun addSlider(tool: Tool) {
                  val value = params[tool.id] ?: 0
                  val label = TextView(this)
                  label.setTextColor(Color.WHITE)
                  label.text = "${tool.label}: $value"
                  label.setPadding(0, dp(8), 0, 0)
                  val sb = SeekBar(this)
                  sb.max = tool.max - tool.min
                  sb.progress = value - tool.min
                  sb.setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                      override fun onProgressChanged(s: SeekBar?, p: Int, fromUser: Boolean) {
                          val v = p + tool.min
                          params[tool.id] = v
                          label.text = "${tool.label}: $v"
                      }
                      override fun onStartTrackingTouch(s: SeekBar?) {}
                      override fun onStopTrackingTouch(s: SeekBar?) {
                          onParamChanged(tool.id)
                      }
                  })
                  toolBox.addView(label)
                  toolBox.addView(sb)
              }

              private fun onParamChanged(id: String) {
                  if (base == null) return
                  val lm = landmarks
                  if (lm != null && (params[id] ?: 0) > 0) {
                      if (id in bodyIds && lm.body == null && !warnedBody) {
                          warnedBody = true
                          Toast.makeText(
                              this,
                              "Corpo não detectado. Use uma foto com o corpo todo visível, de frente.",
                              Toast.LENGTH_LONG
                          ).show()
                      }
                      val hasFace = lm.faces.any { it.outline.isNotEmpty() }
                      if (id in faceIds && !hasFace && !warnedFace) {
                          warnedFace = true
                          Toast.makeText(
                              this,
                              "Rosto não detectado. Use uma foto com o rosto bem visível.",
                              Toast.LENGTH_LONG
                          ).show()
                      }
                  }
                  render()
              }

              private fun render() {
                  val b = base ?: return
                  val myGen = ++gen
                  val pc = HashMap(params)
                  val lm = landmarks
                  executor.execute {
                      if (myGen != gen) return@execute
                      val out = try {
                          Pipeline.run(b, pc, lm)
                      } catch (e: Throwable) {
                          null
                      }
                      runOnUiThread {
                          if (myGen == gen && out != null) {
                              shown = out
                              img.setImageBitmap(out)
                          }
                      }
                  }
              }

              private fun loadImage(uri: Uri) {
                  info.text = "Carregando foto..."
                  Thread {
                      val bmp = try {
                          decode(uri)
                      } catch (e: Throwable) {
                          null
                      }
                      runOnUiThread {
                          if (bmp == null) {
                              info.text = ""
                              Toast.makeText(this, "Não foi possível abrir a foto", Toast.LENGTH_LONG).show()
                          } else {
                              base = bmp
                              shown = null
                              landmarks = null
                              warnedBody = false
                              warnedFace = false
                              initParams()
                              showTab(currentTab)
                              img.setImageBitmap(bmp)
                              hint.visibility = View.GONE
                              info.text = "Detectando rosto e corpo..."
                              Detector.detect(bmp) { lm ->
                                  runOnUiThread {
                                      if (base === bmp) {
                                          landmarks = lm
                                          val hasFace = lm.faces.any { it.outline.isNotEmpty() }
                                          info.text = "Rosto: " + (if (hasFace) "detectado" else "não detectado") +
                                              "   |   Corpo: " + (if (lm.body != null) "detectado" else "não detectado")
                                      }
                                  }
                              }
                          }
                      }
                  }.start()
              }

              private fun decode(uri: Uri): Bitmap? {
                  val maxSide = 1600
                  val bounds = BitmapFactory.Options()
                  bounds.inJustDecodeBounds = true
                  contentResolver.openInputStream(uri)?.use { BitmapFactory.decodeStream(it, null, bounds) }
                  var sample = 1
                  while (max(bounds.outWidth, bounds.outHeight) / (sample * 2) >= maxSide) sample *= 2
                  val opts = BitmapFactory.Options()
                  opts.inSampleSize = sample
                  var bmp = contentResolver.openInputStream(uri)?.use {
                      BitmapFactory.decodeStream(it, null, opts)
                  } ?: return null
                  val longSide = max(bmp.width, bmp.height)
                  if (longSide > maxSide) {
                      val s = maxSide.toFloat() / longSide
                      bmp = Bitmap.createScaledBitmap(bmp, (bmp.width * s).toInt(), (bmp.height * s).toInt(), true)
                  }
                  val orientation = contentResolver.openInputStream(uri)?.use {
                      ExifInterface(it).getAttributeInt(ExifInterface.TAG_ORIENTATION, ExifInterface.ORIENTATION_NORMAL)
                  } ?: ExifInterface.ORIENTATION_NORMAL
                  val m = Matrix()
                  when (orientation) {
                      ExifInterface.ORIENTATION_ROTATE_90 -> m.postRotate(90f)
                      ExifInterface.ORIENTATION_ROTATE_180 -> m.postRotate(180f)
                      ExifInterface.ORIENTATION_ROTATE_270 -> m.postRotate(270f)
                      ExifInterface.ORIENTATION_FLIP_HORIZONTAL -> m.postScale(-1f, 1f)
                      ExifInterface.ORIENTATION_FLIP_VERTICAL -> m.postScale(1f, -1f)
                      else -> {}
                  }
                  if (!m.isIdentity) {
                      bmp = Bitmap.createBitmap(bmp, 0, 0, bmp.width, bmp.height, m, true)
                  }
                  return bmp
              }

              private fun save() {
                  val bmp = shown ?: base
                  if (bmp == null) {
                      Toast.makeText(this, "Abra uma foto primeiro", Toast.LENGTH_SHORT).show()
                      return
                  }
                  Thread {
                      val ok = try {
                          val values = ContentValues()
                          values.put(MediaStore.Images.Media.DISPLAY_NAME, "Retoque_" + System.currentTimeMillis() + ".jpg")
                          values.put(MediaStore.Images.Media.MIME_TYPE, "image/jpeg")
                          if (Build.VERSION.SDK_INT >= 29) {
                              values.put(MediaStore.Images.Media.RELATIVE_PATH, "Pictures/Retoque")
                          }
                          val uri = contentResolver.insert(MediaStore.Images.Media.EXTERNAL_CONTENT_URI, values)
                          if (uri == null) {
                              false
                          } else {
                              contentResolver.openOutputStream(uri)?.use {
                                  bmp.compress(Bitmap.CompressFormat.JPEG, 95, it)
                              } ?: false
                          }
                      } catch (e: Throwable) {
                          false
                      }
                      runOnUiThread {
                          Toast.makeText(
                              this,
                              if (ok) "Salvo na galeria (Pictures/Retoque)" else "Não foi possível salvar",
                              Toast.LENGTH_LONG
                          ).show()
                      }
                  }.start()
              }
          }
