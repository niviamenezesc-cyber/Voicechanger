          package com.example.vozgrave

          import android.Manifest
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.media.AudioDeviceInfo
          import android.media.AudioManager
          import android.media.MediaPlayer
          import android.os.Build
          import android.os.Bundle
          import android.view.WindowManager
          import android.widget.Button
          import android.widget.SeekBar
          import android.widget.TextView
          import android.widget.Toast
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.appcompat.app.AlertDialog
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.content.ContextCompat
          import androidx.core.content.FileProvider
          import java.io.File

          class MainActivity : AppCompatActivity() {

              private lateinit var btnRecord: Button
              private lateinit var btnPlay: Button
              private lateinit var btnShare: Button
              private lateinit var btnApply: Button
              private lateinit var btnLive: Button
              private lateinit var seekGrave: SeekBar
              private lateinit var txtGrave: TextView
              private lateinit var txtStatus: TextView

              private val recorder = Recorder()
              private var raw: ShortArray? = null
              private var player: MediaPlayer? = null
              private var recording = false
              private var hasResult = false
              private lateinit var outFile: File
              private var pendingAction: (() -> Unit)? = null

              private val permLauncher =
                  registerForActivityResult(ActivityResultContracts.RequestPermission()) { granted ->
                      if (granted) pendingAction?.invoke()
                      else Toast.makeText(this, "A permissão do microfone é necessária", Toast.LENGTH_LONG).show()
                      pendingAction = null
                  }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)
                  outFile = File(cacheDir, "voz_grave.wav")

                  btnRecord = findViewById(R.id.btnRecord)
                  btnPlay = findViewById(R.id.btnPlay)
                  btnShare = findViewById(R.id.btnShare)
                  btnApply = findViewById(R.id.btnApply)
                  btnLive = findViewById(R.id.btnLive)
                  seekGrave = findViewById(R.id.seekGrave)
                  txtGrave = findViewById(R.id.txtGrave)
                  txtStatus = findViewById(R.id.txtStatus)

                  updateGraveText()
                  refreshButtons()

                  seekGrave.setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                      override fun onProgressChanged(s: SeekBar?, p: Int, fromUser: Boolean) {
                          updateGraveText()
                          LiveEngine.semitonesDown = semitones().toFloat()
                      }
                      override fun onStartTrackingTouch(s: SeekBar?) {}
                      override fun onStopTrackingTouch(s: SeekBar?) {}
                  })

                  btnRecord.setOnClickListener { toggleRecord() }
                  btnPlay.setOnClickListener { togglePlay() }
                  btnShare.setOnClickListener { share() }
                  btnApply.setOnClickListener { convert() }
                  btnLive.setOnClickListener { toggleLive() }
              }

              override fun onStop() {
                  super.onStop()
                  if (LiveEngine.running) stopLive()
                  stopPlayer()
              }

              override fun onDestroy() {
                  stopPlayer()
                  super.onDestroy()
              }

              private fun semitones(): Int = seekGrave.progress + 1

              private fun updateGraveText() {
                  txtGrave.text = "Quão grave: ${semitones()} semitons"
              }

              private fun setStatus(s: String) {
                  txtStatus.text = s
              }

              private fun refreshButtons() {
                  btnPlay.isEnabled = hasResult
                  btnShare.isEnabled = hasResult
                  btnApply.isEnabled = raw != null
              }

              private fun withMic(action: () -> Unit) {
                  if (ContextCompat.checkSelfPermission(this, Manifest.permission.RECORD_AUDIO)
                      == PackageManager.PERMISSION_GRANTED
                  ) {
                      action()
                  } else {
                      pendingAction = action
                      permLauncher.launch(Manifest.permission.RECORD_AUDIO)
                  }
              }

              // ---------- Gravar e converter ----------

              private fun toggleRecord() {
                  if (!recording) {
                      withMic {
                          stopPlayer()
                          if (recorder.start()) {
                              recording = true
                              btnRecord.text = "PARAR GRAVAÇÃO"
                              setStatus("Gravando... fale normalmente.")
                          } else {
                              setStatus("Não foi possível usar o microfone.")
                          }
                      }
                  } else {
                      recording = false
                      btnRecord.text = "GRAVAR"
                      raw = recorder.stop()
                      convert()
                  }
              }

              private fun convert() {
                  val data = raw ?: return
                  if (data.size < 4410) {
                      setStatus("Gravação muito curta. Grave de novo.")
                      return
                  }
                  stopPlayer()
                  setStatus("Processando... aguarde.")
                  btnRecord.isEnabled = false
                  btnApply.isEnabled = false
                  btnPlay.isEnabled = false
                  btnShare.isEnabled = false
                  val st = semitones().toFloat()
                  Thread {
                      val out = try {
                          VoiceDeepener.process(data, st)
                      } catch (e: Throwable) {
                          null
                      }
                      if (out != null) WavWriter.write(outFile, out, Recorder.SR)
                      runOnUiThread {
                          hasResult = out != null
                          btnRecord.isEnabled = true
                          setStatus(
                              if (out != null) "Pronto! Toque em OUVIR ou COMPARTILHAR."
                              else "Erro ao processar. Tente uma gravação mais curta."
                          )
                          refreshButtons()
                      }
                  }.start()
              }

              private fun togglePlay() {
                  if (player != null) {
                      stopPlayer()
                      return
                  }
                  try {
                      player = MediaPlayer().apply {
                          setDataSource(outFile.absolutePath)
                          setOnCompletionListener { stopPlayer() }
                          prepare()
                          start()
                      }
                      btnPlay.text = "PARAR"
                  } catch (e: Exception) {
                      stopPlayer()
                      setStatus("Não foi possível tocar o áudio.")
                  }
              }

              private fun stopPlayer() {
                  player?.let {
                      runCatching { it.stop() }
                      it.release()
                  }
                  player = null
                  if (::btnPlay.isInitialized) btnPlay.text = "OUVIR"
              }

              private fun share() {
                  val uri = FileProvider.getUriForFile(this, "$packageName.fileprovider", outFile)
                  val i = Intent(Intent.ACTION_SEND).apply {
                      type = "audio/wav"
                      putExtra(Intent.EXTRA_STREAM, uri)
                      addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION)
                  }
                  startActivity(Intent.createChooser(i, "Enviar áudio por"))
              }

              // ---------- Ao vivo (com fone) ----------

              private fun toggleLive() {
                  if (LiveEngine.running) {
                      stopLive()
                      return
                  }
                  withMic {
                      if (!hasHeadset()) {
                          AlertDialog.Builder(this)
                              .setTitle("Conecte um fone")
                              .setMessage(
                                  "Sem fone, o alto-falante entra no microfone e causa eco alto. " +
                                      "Conecte um fone (com fio, USB-C ou Bluetooth) e toque em INICIAR de novo."
                              )
                              .setPositiveButton("OK", null)
                              .show()
                      } else {
                          startLive()
                      }
                  }
              }

              private fun startLive() {
                  LiveEngine.semitonesDown = semitones().toFloat()
                  LiveEngine.start()
                  window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                  btnLive.text = "PARAR AO VIVO"
                  setStatus("Ao vivo ligado. Fale: a voz grave sai no fone.")
                  btnLive.postDelayed({
                      if (!LiveEngine.running) stopLive()
                  }, 800)
              }

              private fun stopLive() {
                  LiveEngine.stop()
                  window.clearFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                  btnLive.text = "INICIAR AO VIVO"
                  setStatus("Ao vivo desligado.")
              }

              private fun hasHeadset(): Boolean {
                  val am = getSystemService(AudioManager::class.java)
                  val ok = mutableListOf(
                      AudioDeviceInfo.TYPE_WIRED_HEADSET,
                      AudioDeviceInfo.TYPE_WIRED_HEADPHONES,
                      AudioDeviceInfo.TYPE_USB_HEADSET,
                      AudioDeviceInfo.TYPE_USB_DEVICE,
                      AudioDeviceInfo.TYPE_BLUETOOTH_A2DP
                  )
                  if (Build.VERSION.SDK_INT >= 31) ok.add(AudioDeviceInfo.TYPE_BLE_HEADSET)
                  return am.getDevices(AudioManager.GET_DEVICES_OUTPUTS).any { it.type in ok }
              }
          }
