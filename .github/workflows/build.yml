                      android:id="@+id/txtStatus"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="8dp"
                      android:text="Pronto para gravar." />

                  <TextView
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="32dp"
                      android:text="2) Ao vivo (somente com fone)"
                      android:textSize="18sp"
                      android:textStyle="bold" />

                  <TextView
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:text="Para ligações em outro aparelho: conecte um fone neste celular e encoste um dos lados no microfone do aparelho da ligação. Neste mesmo celular, o Android não deixa o app entrar na ligação do WhatsApp, Telegram ou Instagram." />

                  <Button
                      android:id="@+id/btnLive"
                      android:layout_width="match_parent"
                      android:layout_height="60dp"
                      android:layout_marginTop="8dp"
                      android:text="INICIAR AO VIVO" />
              </LinearLayout>
          </ScrollView>
          REA_EOF_X
          mkdir -p app/src/main/res/xml
          cat > app/src/main/res/xml/file_paths.xml <<'REA_EOF_X'
          <?xml version="1.0" encoding="utf-8"?>
          <paths>
              <cache-path name="audio" path="." />
          </paths>
          REA_EOF_X
          cat > build.gradle.kts <<'REA_EOF_X'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          REA_EOF_X
          cat > gradle.properties <<'REA_EOF_X'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=true
          kotlin.code.style=official
          REA_EOF_X
          cat > settings.gradle.kts <<'REA_EOF_X'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "VozGrave"
          include(":app")
          REA_EOF_X
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Compilar APK
        run: gradle assembleDebug --no-daemon
      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: VozGrave-APK
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publicar APK em Releases
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk VozGrave.apk
          gh release create "vozgrave-${{ github.run_number }}" VozGrave.apk --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "Voz Grave APK #${{ github.run_number }}" --notes "APK de teste (debug)."
