          package com.example.vozgrave

          import android.annotation.SuppressLint
          import android.media.AudioAttributes
          import android.media.AudioFormat
          import android.media.AudioRecord
          import android.media.AudioTrack
          import android.media.MediaRecorder
          import android.os.Process
          import kotlin.math.abs
          import kotlin.math.max
          import kotlin.math.pow
          import kotlin.math.tanh

          /** Modo ao vivo: microfone -> voz mais grave -> saída (use com fone para não ter eco). */
          object LiveEngine {
              private const val SR = 48000
              private const val FRAME = 960
              private const val HP_A = 0.985f
              private const val LP_ALPHA = 0.34f
              private const val GATE = 0.012f

              @Volatile var semitonesDown = 4f
              @Volatile var running = false
              private var thread: Thread? = null

              fun start() {
                  if (running) return
                  running = true
                  thread = Thread({ loop() }, "live-engine").also { it.start() }
              }

              fun stop() {
                  running = false
                  thread?.join(700)
                  thread = null
              }

              @SuppressLint("MissingPermission")
              private fun loop() {
                  Process.setThreadPriority(Process.THREAD_PRIORITY_URGENT_AUDIO)

                  val minIn = AudioRecord.getMinBufferSize(
                      SR, AudioFormat.CHANNEL_IN_MONO, AudioFormat.ENCODING_PCM_16BIT
                  )
                  val rec = AudioRecord(
                      MediaRecorder.AudioSource.MIC, SR,
                      AudioFormat.CHANNEL_IN_MONO, AudioFormat.ENCODING_PCM_16BIT,
                      max(minIn, FRAME * 2 * 4)
                  )
                  if (rec.state != AudioRecord.STATE_INITIALIZED) {
                      rec.release(); running = false; return
                  }

                  val minOut = AudioTrack.getMinBufferSize(
                      SR, AudioFormat.CHANNEL_OUT_MONO, AudioFormat.ENCODING_PCM_16BIT
                  )
                  val track = AudioTrack.Builder()
                      .setAudioAttributes(
                          AudioAttributes.Builder()
                              .setUsage(AudioAttributes.USAGE_MEDIA)
                              .setContentType(AudioAttributes.CONTENT_TYPE_SPEECH).build()
                      )
                      .setAudioFormat(
                          AudioFormat.Builder().setSampleRate(SR)
                              .setEncoding(AudioFormat.ENCODING_PCM_16BIT)
                              .setChannelMask(AudioFormat.CHANNEL_OUT_MONO).build()
                      )
                      .setBufferSizeInBytes(max(minOut, FRAME * 2 * 4))
                      .setTransferMode(AudioTrack.MODE_STREAM)
                      .build()

                  val shifter = PitchShifter(SR)
                  val inBuf = ShortArray(FRAME)
                  val outBuf = ShortArray(FRAME)
                  var hpX = 0f; var hpY = 0f; var lp = 0f
                  var env = 0f; var g = 0f

                  try {
                      val silence = ShortArray(FRAME)
                      track.write(silence, 0, FRAME)
                      track.write(silence, 0, FRAME)
                      rec.startRecording()
                      track.play()

                      while (running) {
                          val n = rec.read(inBuf, 0, FRAME)
                          if (n <= 0) continue
                          shifter.ratio = 2f.pow(-semitonesDown / 12f)

                          for (i in 0 until n) {
                              var x = inBuf[i] / 32768f
                              val hp = HP_A * (hpY + x - hpX)
                              hpX = x; hpY = hp
                              lp += LP_ALPHA * (hp - lp)
                              x = lp

                              val ax = abs(x)
                              env = if (ax > env) ax else env * 0.9995f
                              val target = if (env > GATE) 1f else 0f
                              g += (target - g) * (if (target > g) 0.02f else 0.0008f)
                              x *= g

                              x = shifter.process(x)
                              x = tanh(x * 2f)
                              outBuf[i] = (x * 32767f).toInt().toShort()
                          }
                          track.write(outBuf, 0, n)
                      }
                  } finally {
                      runCatching { rec.stop() }
                      runCatching { track.stop() }
                      rec.release()
                      track.release()
                      running = false
                  }
              }
          }
