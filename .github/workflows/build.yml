                      android:id="@+id/btnReset"
                      android:layout_width="0dp"
                      android:layout_height="wrap_content"
                      android:layout_weight="1"
                      android:text="ZERAR" />

                  <Button
                      android:id="@+id/btnSave"
                      android:layout_width="0dp"
                      android:layout_height="wrap_content"
                      android:layout_weight="1"
                      android:text="SALVAR" />
              </LinearLayout>
          </LinearLayout>
          REA_EOF_X
          cat > build.gradle.kts <<'REA_EOF_X'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          REA_EOF_X
          cat > gradle.properties <<'REA_EOF_X'
          org.gradle.jvmargs=-Xmx3g
          android.useAndroidX=true
          kotlin.code.style=official
          REA_EOF_X
          cat > settings.gradle.kts <<'REA_EOF_X'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "Retoque"
          include(":app")
          REA_EOF_X
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Compilar APK
        run: gradle assembleDebug --no-daemon
      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Retoque-APK
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publicar APK em Releases
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Retoque.apk
          gh release create "retoque-${{ github.run_number }}" Retoque.apk --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "Retoque APK #${{ github.run_number }}" --notes "APK de teste (debug)."
