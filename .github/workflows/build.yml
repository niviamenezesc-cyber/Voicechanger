          package com.example.vozgrave

          import java.io.File
          import java.nio.ByteBuffer
          import java.nio.ByteOrder
          import kotlin.math.PI
          import kotlin.math.abs
          import kotlin.math.cos
          import kotlin.math.max
          import kotlin.math.min
          import kotlin.math.pow
          import kotlin.math.sqrt

          /**
           * Deixa a voz mais grave mantendo a duração (processamento offline, melhor qualidade).
           * 1) Comprime o tempo com WSOLA (sem mudar o tom).
           * 2) Reproduz mais devagar (reamostragem), o que baixa o tom e devolve a duração original.
           */
          object VoiceDeepener {

              fun process(input: ShortArray, semitonesDown: Float): ShortArray {
                  val r = 2.0.pow(-semitonesDown / 12.0) // < 1
                  val x = FloatArray(input.size) { input[it] / 32768f }
                  val compressed = wsola(x, r)
                  val out = resample(compressed, r)

                  var peak = 0f
                  for (v in out) {
                      val a = abs(v)
                      if (a > peak) peak = a
                  }
                  val gain = if (peak > 0.0001f) min(0.9f / peak, 3f) else 1f
                  return ShortArray(out.size) {
                      (out[it] * gain * 32767f).coerceIn(-32768f, 32767f).toInt().toShort()
                  }
              }

              private fun wsola(x: FloatArray, alpha: Double): FloatArray {
                  val n = 2048
                  val hs = n / 2
                  val delta = 512
                  val ha = hs / alpha
                  val targetLen = (x.size * alpha).toInt()
                  val xp = FloatArray(x.size + 4 * n)
                  System.arraycopy(x, 0, xp, 0, x.size)
                  val out = FloatArray(targetLen + 2 * n)
                  val win = FloatArray(n) { (0.5 - 0.5 * cos(2.0 * PI * it / n)).toFloat() }

                  // primeiro quadro: metade inicial sem janela para não ter "fade-in"
                  for (i in 0 until hs) out[i] += xp[i]
                  for (i in hs until n) out[i] += win[i] * xp[i]

                  var prev = 0
                  var k = 1
                  while (true) {
                      val nominal = (k * ha).toInt()
                      if (nominal >= x.size || k * hs + n > out.size) break
                      val tpl = prev + hs
                      val lo = max(0, nominal - delta)
                      val hi = nominal + delta
                      var best = lo
                      var bestScore = -Float.MAX_VALUE
                      var c = lo
                      while (c <= hi) {
                          var dot = 0f
                          var en = 1e-6f
                          var i = 0
                          while (i < hs) {
                              val a = xp[c + i]
                              dot += a * xp[tpl + i]
                              en += a * a
                              i += 4
                          }
                          val score = dot / sqrt(en)
                          if (score > bestScore) {
                              bestScore = score
                              best = c
                          }
                          c += 2
                      }
                      val base = k * hs
                      for (i in 0 until n) out[base + i] += win[i] * xp[best + i]
                      prev = best
                      k++
                  }
                  return out.copyOf(targetLen)
              }

              private fun resample(x: FloatArray, step: Double): FloatArray {
                  val len = (x.size / step).toInt()
                  val out = FloatArray(len)
                  for (i in 0 until len) {
                      val pos = i * step
                      val j = pos.toInt()
                      val f = (pos - j).toFloat()
                      val a = x[j]
                      val b = if (j + 1 < x.size) x[j + 1] else a
                      out[i] = a + (b - a) * f
                  }
                  return out
              }
          }

          object WavWriter {
              fun write(file: File, pcm: ShortArray, sampleRate: Int) {
                  val bytes = pcm.size * 2
                  val bb = ByteBuffer.allocate(44 + bytes).order(ByteOrder.LITTLE_ENDIAN)
                  bb.put("RIFF".toByteArray())
                  bb.putInt(36 + bytes)
                  bb.put("WAVE".toByteArray())
                  bb.put("fmt ".toByteArray())
                  bb.putInt(16)
                  bb.putShort(1)   // PCM
                  bb.putShort(1)   // mono
                  bb.putInt(sampleRate)
                  bb.putInt(sampleRate * 2)
                  bb.putShort(2)
                  bb.putShort(16)
                  bb.put("data".toByteArray())
                  bb.putInt(bytes)
                  for (s in pcm) bb.putShort(s)
                  file.writeBytes(bb.array())
              }
          }
