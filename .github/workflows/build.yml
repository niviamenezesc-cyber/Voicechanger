          package com.example.retoque

          import android.graphics.Bitmap
          import android.graphics.Canvas
          import android.graphics.ColorMatrixColorFilter
          import android.graphics.Paint
          import android.graphics.PointF
          import kotlin.math.abs
          import kotlin.math.hypot

          /**
           * Ordem: pele/maquiagem/cor (usam as posições originais) -> nitidez -> deformações (por último).
           * Todos os valores dos controles são lidos do mapa "p".
           */
          object Pipeline {

              private val WARP_IDS = listOf(
                  "faceSlim", "chin", "eyes", "nose", "smile", "headSmall",
                  "bodySlim", "waist", "legLong", "legSlim"
              )

              fun run(src: Bitmap, p: Map<String, Int>, lm: Landmarks?): Bitmap {
                  fun v(id: String): Int = p[id] ?: 0

                  val w = src.width
                  val h = src.height
                  val faces = lm?.faces?.filter { it.outline.isNotEmpty() } ?: emptyList()
                  val body = lm?.body

                  val anySkin = v("smooth") > 0 || v("whiten") > 0
                  val anyMakeup = (v("lipstick") > 0 || v("blush") > 0) && faces.isNotEmpty()
                  val anyColor = v("brightness") != 0 || v("contrast") != 0 ||
                      v("saturation") != 0 || v("warmth") != 0 ||
                      (v("filter") != 0 && v("fstrength") > 0)
                  val anySharp = v("sharp") > 0
                  val anyWarp = WARP_IDS.any { v(it) > 0 }
                  if (!anySkin && !anyMakeup && !anyColor && !anySharp && !anyWarp) return src

                  var px = IntArray(w * h)
                  src.getPixels(px, 0, w, 0, 0, w, h)

                  if (anySkin) {
                      val mask = if (faces.isNotEmpty()) ImageOps.faceMask(w, h, faces) else null
                      if (v("smooth") > 0) ImageOps.smoothSkin(px, w, h, mask, v("smooth") / 100f)
                      if (v("whiten") > 0) ImageOps.whiten(px, mask, v("whiten") / 100f)
                  }

                  if (anyMakeup || anyColor) {
                      var bmp = Bitmap.createBitmap(w, h, Bitmap.Config.ARGB_8888)
                      bmp.setPixels(px, 0, w, 0, 0, w, h)
                      if (anyMakeup) ImageOps.makeup(bmp, faces, v("lipstick"), v("blush"))
                      if (anyColor) {
                          val out = Bitmap.createBitmap(w, h, Bitmap.Config.ARGB_8888)
                          val paint = Paint(Paint.FILTER_BITMAP_FLAG)
                          paint.colorFilter = ColorMatrixColorFilter(
                              ImageOps.colorMatrix(
                                  v("brightness"), v("contrast"), v("saturation"), v("warmth"),
                                  v("filter"), v("fstrength")
                              )
                          )
                          Canvas(out).drawBitmap(bmp, 0f, 0f, paint)
                          bmp.recycle()
                          bmp = out
                      }
                      bmp.getPixels(px, 0, w, 0, 0, w, h)
                      bmp.recycle()
                  }

                  if (anySharp) ImageOps.sharpen(px, w, h, v("sharp") / 100f * 1.5f)

                  if (anyWarp) {
                      val field = WarpField(w, h)
                      addFaceWarps(field, faces, p)
                      addBodyWarps(field, body, p, w, h)
                      if (field.used) px = field.apply(px)
                  }

                  val result = Bitmap.createBitmap(w, h, Bitmap.Config.ARGB_8888)
                  result.setPixels(px, 0, w, 0, 0, w, h)
                  return result
              }

              private fun addFaceWarps(f: WarpField, faces: List<FaceData>, p: Map<String, Int>) {
                  val slim = (p["faceSlim"] ?: 0) / 100f
                  val chin = (p["chin"] ?: 0) / 100f
                  val eyes = (p["eyes"] ?: 0) / 100f
                  val nose = (p["nose"] ?: 0) / 100f
                  val smile = (p["smile"] ?: 0) / 100f
                  val head = (p["headSmall"] ?: 0) / 100f

                  for (face in faces) {
                      val b = face.bounds
                      val cx = b.exactCenterX()
                      val cy = b.exactCenterY()
                      val fw = b.width().toFloat()
                      val fh = b.height().toFloat()

                      if (slim > 0f) {
                          for (pt in face.outline) {
                              if (pt.y > cy) {
                                  f.addPush(pt.x, pt.y, fw * 0.22f, fw * 0.22f, (cx - pt.x) * 0.12f * slim, 0f)
                              }
                          }
                      }
                      if (chin > 0f) {
                          val bottom = face.outline.maxByOrNull { it.y }
                          if (bottom != null) {
                              f.addPush(bottom.x, bottom.y, fw * 0.30f, fw * 0.30f, 0f, -fh * 0.10f * chin)
                          }
                      }
                      if (eyes > 0f) {
                          for (eye in listOf(face.leftEye, face.rightEye)) {
                              if (eye.size < 3) continue
                              val ex = eye.map { it.x }.average().toFloat()
                              val ey = eye.map { it.y }.average().toFloat()
                              val ew = eye.maxOf { it.x } - eye.minOf { it.x }
                              f.addBulge(ex, ey, ew * 1.4f, ew * 1.4f, 0.45f * eyes)
                          }
                      }
                      if (nose > 0f && face.noseBottom.size >= 2) {
                          val a = face.noseBottom.first()
                          val z = face.noseBottom.last()
                          val mid = (a.x + z.x) / 2f
                          val nw = abs(z.x - a.x)
                          for (pt in listOf(a, z)) {
                              f.addPush(pt.x, pt.y, nw * 0.9f, nw * 0.9f, (mid - pt.x) * 0.35f * nose, 0f)
                          }
                      }
                      val ml = face.mouthLeft
                      val mr = face.mouthRight
                      if (smile > 0f && ml != null && mr != null) {
                          val mw = abs(mr.x - ml.x)
                          for (pt in listOf(ml, mr)) {
                              f.addPush(pt.x, pt.y, mw * 0.5f, mw * 0.5f, 0f, -mw * 0.12f * smile)
                          }
                      }
                      if (head > 0f) {
                          f.addBulge(cx, cy - fh * 0.1f, fw * 1.1f, fh * 1.1f, -0.25f * head)
                      }
                  }
              }

              private fun lerp(a: PointF, b: PointF, t: Float) =
                  PointF(a.x + (b.x - a.x) * t, a.y + (b.y - a.y) * t)

              private fun addBodyWarps(f: WarpField, body: BodyData?, p: Map<String, Int>, w: Int, h: Int) {
                  if (body == null) return
                  val slim = (p["bodySlim"] ?: 0) / 100f
                  val waist = (p["waist"] ?: 0) / 100f
                  val legLong = (p["legLong"] ?: 0) / 100f
                  val legSlim = (p["legSlim"] ?: 0) / 100f

                  val ls = body.leftShoulder
                  val rs = body.rightShoulder
                  val lh = body.leftHip
                  val rh = body.rightHip
                  val shMid = lerp(ls, rs, 0.5f)
                  val hipMid = lerp(lh, rh, 0.5f)
                  val sw = abs(ls.x - rs.x)
                  val torsoH = hypot(hipMid.x - shMid.x, hipMid.y - shMid.y)
                  if (sw < 10f || torsoH < 10f) return

                  if (slim > 0f) {
                      for (t in listOf(0.25f, 0.45f, 0.65f, 0.85f)) {
                          val c = lerp(shMid, hipMid, t)
                          for (side in listOf(-1f, 1f)) {
                              f.addPush(
                                  c.x + side * sw * 0.42f, c.y, sw * 0.30f, torsoH * 0.22f,
                                  -side * sw * 0.42f * 0.30f * slim, 0f
                              )
                          }
                      }
                  }
                  if (waist > 0f) {
                      val c = lerp(shMid, hipMid, 0.62f)
                      for (side in listOf(-1f, 1f)) {
                          f.addPush(
                              c.x + side * sw * 0.40f, c.y, sw * 0.32f, torsoH * 0.25f,
                              -side * sw * 0.40f * 0.40f * waist, 0f
                          )
                      }
                  }
                  if (legSlim > 0f) {
                      val legs = listOf(
                          Triple(lh, body.leftKnee, body.leftAnkle),
                          Triple(rh, body.rightKnee, body.rightAnkle)
                      )
                      for ((hip, knee, ankle) in legs) {
                          if (knee == null || ankle == null) continue
                          val spots = listOf(
                              lerp(hip, knee, 0.3f) to sw * 0.17f,
                              lerp(hip, knee, 0.7f) to sw * 0.14f,
                              lerp(knee, ankle, 0.3f) to sw * 0.12f,
                              lerp(knee, ankle, 0.7f) to sw * 0.09f
                          )
                          for ((c, half) in spots) {
                              for (side in listOf(-1f, 1f)) {
                                  f.addPush(
                                      c.x + side * half, c.y, sw * 0.16f, sw * 0.30f,
                                      -side * half * 0.4f * legSlim, 0f
                                  )
                              }
                          }
                      }
                  }
                  if (legLong > 0f) {
                      val y0 = hipMid.y + torsoH * 0.10f
                      f.addStretchBelow(y0, 1f + 0.22f * legLong, h * 0.10f)
                  }
              }
          }
