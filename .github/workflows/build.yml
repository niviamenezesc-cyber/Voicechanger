          package com.example.vozgrave

          import android.annotation.SuppressLint
          import android.media.AudioFormat
          import android.media.AudioRecord
          import android.media.MediaRecorder
          import kotlin.math.max

          /** Grava o microfone em memória (mono, 16 bits, 44,1 kHz). Limite: 5 minutos. */
          class Recorder {
              companion object {
                  const val SR = 44100
              }

              @Volatile private var recording = false
              private var thread: Thread? = null
              private var data = ShortArray(SR * 10)
              private var len = 0

              @SuppressLint("MissingPermission")
              fun start(): Boolean {
                  val minBuf = AudioRecord.getMinBufferSize(
                      SR, AudioFormat.CHANNEL_IN_MONO, AudioFormat.ENCODING_PCM_16BIT
                  )
                  if (minBuf <= 0) return false
                  val rec = AudioRecord(
                      MediaRecorder.AudioSource.MIC, SR,
                      AudioFormat.CHANNEL_IN_MONO, AudioFormat.ENCODING_PCM_16BIT,
                      max(minBuf, SR)
                  )
                  if (rec.state != AudioRecord.STATE_INITIALIZED) {
                      rec.release()
                      return false
                  }
                  len = 0
                  recording = true
                  thread = Thread {
                      val buf = ShortArray(2048)
                      rec.startRecording()
                      while (recording && len < SR * 300) {
                          val n = rec.read(buf, 0, buf.size)
                          if (n > 0) {
                              ensure(n)
                              System.arraycopy(buf, 0, data, len, n)
                              len += n
                          } else if (n < 0) break
                      }
                      runCatching { rec.stop() }
                      rec.release()
                  }.also { it.start() }
                  return true
              }

              fun stop(): ShortArray {
                  recording = false
                  thread?.join()
                  thread = null
                  return data.copyOf(len)
              }

              private fun ensure(n: Int) {
                  if (len + n > data.size) data = data.copyOf(max(data.size * 2, len + n))
              }
          }
