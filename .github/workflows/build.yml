          package com.example.retoque

          import kotlin.math.max
          import kotlin.math.min

          /**
           * Campo de deformação (liquify). Todas as deformações somam seus deslocamentos
           * e a imagem é reamostrada uma única vez no final (sem perder nitidez).
           */
          class WarpField(private val w: Int, private val h: Int) {
              private val ox = FloatArray(w * h)
              private val oy = FloatArray(w * h)
              var used = false
                  private set

              /** Empurra o conteúdo do ponto (cx,cy) pelo vetor (mx,my), com queda suave até a borda da elipse. */
              fun addPush(cx: Float, cy: Float, rx: Float, ry: Float, mx: Float, my: Float) {
                  if (rx < 1f || ry < 1f) return
                  used = true
                  val x0 = max(0, (cx - rx).toInt())
                  val x1 = min(w - 1, (cx + rx).toInt())
                  val y0 = max(0, (cy - ry).toInt())
                  val y1 = min(h - 1, (cy + ry).toInt())
                  for (y in y0..y1) {
                      val ny = (y - cy) / ry
                      for (x in x0..x1) {
                          val nx = (x - cx) / rx
                          val d2 = nx * nx + ny * ny
                          if (d2 < 1f) {
                              val f = 1f - d2
                              val k = f * f
                              val i = y * w + x
                              ox[i] -= mx * k
                              oy[i] -= my * k
                          }
                      }
                  }
              }

              /** s > 0 aumenta a região; s < 0 diminui. */
              fun addBulge(cx: Float, cy: Float, rx: Float, ry: Float, s: Float) {
                  if (rx < 1f || ry < 1f) return
                  used = true
                  val x0 = max(0, (cx - rx).toInt())
                  val x1 = min(w - 1, (cx + rx).toInt())
                  val y0 = max(0, (cy - ry).toInt())
                  val y1 = min(h - 1, (cy + ry).toInt())
                  for (y in y0..y1) {
                      val ny = (y - cy) / ry
                      for (x in x0..x1) {
                          val nx = (x - cx) / rx
                          val d2 = nx * nx + ny * ny
                          if (d2 < 1f) {
                              val f = 1f - d2
                              val k = s * f * f
                              val i = y * w + x
                              ox[i] += (cx - x) * k
                              oy[i] += (cy - y) * k
                          }
                      }
                  }
              }

              /** Estica verticalmente tudo que está abaixo de y0 (usado para alongar as pernas). */
              fun addStretchBelow(y0: Float, k: Float, ramp: Float) {
                  if (k <= 1f || ramp < 1f) return
                  used = true
                  for (y in 0 until h) {
                      val fy = y.toFloat()
                      if (fy <= y0) continue
                      val t = ((fy - y0) / ramp).coerceIn(0f, 1f)
                      val wgt = t * t * (3f - 2f * t)
                      val off = -wgt * (fy - y0) * (1f - 1f / k)
                      val row = y * w
                      for (x in 0 until w) oy[row + x] += off
                  }
              }

              fun apply(src: IntArray): IntArray {
                  val out = IntArray(w * h)
                  for (y in 0 until h) {
                      for (x in 0 until w) {
                          val i = y * w + x
                          val dx = ox[i]
                          val dy = oy[i]
                          out[i] = if (dx == 0f && dy == 0f) src[i] else sample(src, x + dx, y + dy)
                      }
                  }
                  return out
              }

              private fun sample(src: IntArray, x: Float, y: Float): Int {
                  val xf = x.coerceIn(0f, w - 1.001f)
                  val yf = y.coerceIn(0f, h - 1.001f)
                  val x0 = xf.toInt()
                  val y0 = yf.toInt()
                  val fx = xf - x0
                  val fy = yf - y0
                  val a = src[y0 * w + x0]
                  val b = src[y0 * w + x0 + 1]
                  val c = src[(y0 + 1) * w + x0]
                  val d = src[(y0 + 1) * w + x0 + 1]
                  return (0xFF shl 24) or
                      (mix(a, b, c, d, fx, fy, 16) shl 16) or
                      (mix(a, b, c, d, fx, fy, 8) shl 8) or
                      mix(a, b, c, d, fx, fy, 0)
              }

              private fun mix(a: Int, b: Int, c: Int, d: Int, fx: Float, fy: Float, s: Int): Int {
                  val ca = (a shr s) and 255
                  val cb = (b shr s) and 255
                  val cc = (c shr s) and 255
                  val cd = (d shr s) and 255
                  val top = ca + (cb - ca) * fx
                  val bot = cc + (cd - cc) * fx
                  return (top + (bot - top) * fy + 0.5f).toInt()
              }
          }
